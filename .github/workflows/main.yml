#
# li is a library module: it produces no binary and no container image, so this
# pipeline omits the docker-build, hadolint and e2e-test jobs the network-function
# repositories run. Everything else is the standard omec-project set, pinned to
# the same reusable-workflow revision they use.
name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/build.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}

  static-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/static-analysis.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}

  lint:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/lint.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      golangci_lint_version: 'v2.11.3'
      branch_name: ${{ github.ref }}

  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}

  fossa-scan:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/fossa-scan.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}

  unit-tests:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/unit-test.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}

  # The conformance checks validate this module's output against the published
  # ETSI and 3GPP definitions vendored under testdata. The X1 half shells out to
  # xmllint, which the shared unit-test runner image does not declare, so it
  # skips there — and a skipped check reports success while validating nothing.
  # This job installs the validator and sets LI_REQUIRE_SCHEMA_VALIDATION, which
  # turns that skip into a failure, so exactly one job promises the validation
  # actually ran. The TS 33.128 record audit needs no external tooling and runs
  # everywhere, including here.
  conformance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the XML schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Confirm the validator is present
        run: xmllint --version

      - name: Run the conformance checks
        env:
          LI_REQUIRE_SCHEMA_VALIDATION: '1'
        run: go test -v ./x1/ ./iri/ -run 'Validate|Drift|Schema|ASN1'

  analysis:
    if: github.repository_owner == 'omec-project'
    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      drives: read
      id-token: write
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: write
      statuses: read
      vulnerability-alerts: read
    uses: omec-project/.github/.github/workflows/scorecard-analysis.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
